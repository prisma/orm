name: Notify Slack of outside contributions

# Posts each new issue and pull request opened by someone outside the Prisma
# organisation to the Slack webhook in the
# EXTERNAL_CONTRIBUTIONS_SLACK_WEBHOOK_URL repository secret.
#
# It runs on a schedule and reads the API, rather than reacting to the opened
# events, because a workflow triggered by a pull request from a fork gets no
# secrets, and the trigger that would get them is banned here
# (.agents/rules/no-pull-request-target.mdc). Each run covers the time since
# the last successful run started, so a failed run is retried by the next one.
on:
  schedule:
    # Offset from the top of the hour, where GitHub delays or drops scheduled runs.
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

concurrency:
  group: notify-external-contributions
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Post new outside issues and pull requests to Slack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.EXTERNAL_CONTRIBUTIONS_SLACK_WEBHOOK_URL }}
        run: node ./.github/workflows/scripts/notify-external-contributions.mjs
