name: Publish to npm

# Source-of-truth model:
#   The version comes from the root `package.json` `version` field.
#   Maintainers advance it via `pnpm bump-version` (see
#   docs/oss/versioning.md). This workflow can never publish a version
#   other than what is committed at HEAD.
#
# Trigger model:
#   - push to `main` with the root `version` unchanged → publish
#     `<base>-dev.N` under dist-tag `dev`.
#   - push to `main` with the root `version` changed   → publish `<base>`
#     under dist-tag `latest` and create a GitHub Release (marked
#     pre-release for RC-line versions like `8.0.0-rc.N`). `latest`
#     tracks the newest release, RC or stable — the package names this
#     repo publishes have no pre-v8 stable audience to protect. This is
#     how a merged `chore(release): ...` PR auto-ships. The same run then
#     publishes `<base>-dev.N` under `dev`, so every push to `main` —
#     release or not — leaves the `dev` dist-tag on a build of that
#     commit (adopted from prisma/composer#241). When releases skipped
#     the dev publish, `dev` sat on the previous base until the next
#     routine push — which broke prisma-cli's dev channel on 2026-08-25.
#   - workflow_dispatch                                 → publish `<base>`
#     under the chosen dist-tag (default `latest`); also the dry-run path.

on:
  push:
    branches: [main]
    tags: ["!**"]
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag (e.g., latest, dev, beta)"
        required: true
        default: "latest"
        type: string
      dry-run:
        description: "Dry-run only (build + pack + lint, no npm publish, no GitHub Release)."
        required: false
        default: true
        type: boolean

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish packages to npm
    runs-on: ubuntu-latest
    # Only `main` may produce a real publish. A dry-run dispatch is permitted
    # from any branch so maintainers can validate the pipeline (build + pack +
    # publish-dep gate + `pnpm publish --dry-run`) before merging changes that
    # touch publishing. The dry-run path performs no registry writes and skips
    # the GitHub Release step, so non-main runs cannot affect production state.
    if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true') }}
    permissions:
      contents: write # Required to create the GitHub Release + tag for stable publishes
      id-token: write # Required for npm OIDC Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history reaching `github.event.before` so `determine-version.ts`
          # can compare the root `package.json` version at that ref to HEAD and
          # decide whether this push is a release bump (publish `latest`) or a
          # routine commit (publish `dev`). A multi-commit push can place
          # `before` arbitrarily far back, so fetch the full history.
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Configure npm
        run: pnpm config set registry https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine version
        id: version
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_DIST_TAG: ${{ github.event.inputs.dist-tag }}
          # `before` is the ref `main` pointed at before this push.
          # `determine-version.ts` reads the root `package.json` at that ref
          # to detect release bumps. Empty for `workflow_dispatch`, which
          # the script also handles.
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/determine-version.ts

      - name: Set package versions
        run: node scripts/set-version.ts "${{ steps.version.outputs.version }}"

      - name: Build packages
        run: pnpm build

      # Publish-time gate: packs every publishable workspace package and
      # verifies the resolved package.json contains no `workspace:*` or
      # `catalog:` dependency specifiers. `pnpm publish` rewrites these on
      # its own, but `npm publish` (and some CI flows) don't — and a single
      # leaked specifier breaks downstream installs. This gate fails the
      # publish before anything reaches the registry.
      - name: Check publish dependency specifiers
        run: pnpm check:publish-deps

      # Publish-time gate: three conformance checks over what actually
      # ships — packed JavaScript imports only declared packages, the
      # shipped orm config-section validator never throws, and the
      # @prisma/orm-toolchain tarball installs into a clean sandbox with
      # working bins and a single agreed @prisma/cli-engine pin. See
      # `scripts/check-conformance.mjs`. The same three checks run in the
      # prisma-cli repo (prisma/prisma-cli#161).
      - name: Run conformance checks
        run: pnpm check:conformance

      # Publish-time gate: ensures every substrate change since the previous
      # `v[0-9]*` tag is accompanied by a matching upgrade-instructions
      # directory in the user-skill / extension-upgrade-skill packages, and
      # that any newly added entries land in the in-flight transition
      # directory. See `scripts/check-upgrade-coverage.mjs`.
      - name: Check upgrade-instruction coverage
        run: pnpm check:upgrade-coverage --mode publish

      # Publish-time check (releases only): a `latest` Release publishes
      # the committed notes file as its body, so that file must exist
      # before anything reaches the registry — a release with missing or
      # flat notes must fail here, not after the packages are already
      # public. There is no auto-generated fallback. Dev/beta builds
      # create no Release, so the check is scoped to `latest`, matching
      # the Release step's own condition.
      - name: Check release notes
        if: ${{ steps.version.outputs.tag == 'latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true') }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: pnpm check:release-notes --mode publish --version "$VERSION"

      # Both publish paths fan out across `PUBLISH_CONCURRENCY` workers
      # (default 8) via `scripts/publish-packages.mjs`. `pnpm -r publish` is
      # intentionally serialized (it rejects `--workspace-concurrency`
      # outright), and the per-package npm upload + Sigstore signing
      # round-trips dominate wall-clock time, so serial publish of ~60
      # packages takes 5–10 minutes on CI. Fanning out brings it down by
      # close to the concurrency factor while staying well below npm's
      # informal abuse thresholds.

      # Dry-run path: exercises the full publish pipeline (pack, validate
      # tarball contents, dependency rewriting) without touching the npm
      # registry. Use from any branch via `workflow_dispatch` to validate
      # changes that affect publishing before merging.
      - name: Publish packages (dry-run)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run == 'true' }}
        run: node scripts/publish-packages.mjs --tag "${{ steps.version.outputs.tag }}" --dry-run

      # NODE_AUTH_TOKEN is intentionally NOT set. npm detects the OIDC environment
      # (id-token: write) and authenticates via Trusted Publishing automatically.
      # Setting NODE_AUTH_TOKEN to any value -- even empty string -- would block OIDC.
      #
      # Enable npm provenance attestations for each published package.
      # This requires a public source repository (npm rejects provenance from private repos).
      - name: Publish packages
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/publish-packages.mjs --tag "${{ steps.version.outputs.tag }}"

      # Lightweight git tag for non-latest publishes (dev / beta / …).
      # `latest` publishes get a tag implicitly via `gh release create`
      # below; dev-channel builds need one too because `prisma-next init` resolves
      # its skill-cluster URL via `#v<cliVersion>` (see packages/1-framework/
      # 3-tooling/cli/src/commands/init/skill-install.ts), which 404s without a
      # matching git ref. Tag-only is intentional — a full Release per dev build
      # would drown out the changelog signal. (TML-2696)
      #
      # Idempotent on workflow rerun: if `v$VERSION` already exists, skip.
      - name: Create lightweight git tag for non-latest publishes
        if: ${{ steps.version.outputs.tag != 'latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; skipping"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -X POST \
              -f ref="refs/tags/v$VERSION" \
              -f "sha=$GITHUB_SHA"
          fi

      # Emit a GitHub Release for `latest` publishes only (marked
      # pre-release when the version is on the RC line). Dev / PR / beta
      # builds publish to npm but do not produce a Release — those would
      # drown out the changelog signal. The Release is created at
      # $GITHUB_SHA so the tag points at the same commit the publish ran from.
      # The body is the committed `docs/releases/v$VERSION.md` (its presence is
      # enforced by the "Check release notes" step above); there is no
      # auto-generated fallback.
      #
      # Idempotent on workflow rerun: if a Release for `v$VERSION` already exists
      # (e.g. a previous run published to npm but failed before this step), edit
      # it in place rather than re-creating it. The edit sets title/target only
      # and preserves the already-published body rather than re-pushing the
      # file — the right trade-off versus clobbering a hand-edited body or
      # failing the rerun outright.
      - name: Create GitHub Release for latest publishes
        if: ${{ steps.version.outputs.tag == 'latest' && (github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *-rc.*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release edit "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION"
          else
            gh release create "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --notes-file "docs/releases/v$VERSION.md" \
              $PRERELEASE_FLAG
          fi

      # --- Dev follow-up, release pushes only (devVersion is empty otherwise).
      # Keeps the `dev` dist-tag on a build of the released base instead of the
      # previous one (adopted from prisma/composer#241). Runs before the
      # prisma-cli notification below: the repin that notification triggers
      # builds prisma-cli's dev channel against this repo's `dev` tag, so `dev`
      # must already point at the new base when the dispatch fires. The release
      # steps above already ran the full check battery against this commit;
      # only the version stamp changes here, so the follow-up re-runs just the
      # version-sensitive dependency-specifier check before publishing.

      - name: Set package versions (dev follow-up)
        if: ${{ steps.version.outputs.devVersion != '' }}
        run: node scripts/set-version.ts "${{ steps.version.outputs.devVersion }}"

      - name: Build packages (dev follow-up)
        if: ${{ steps.version.outputs.devVersion != '' }}
        run: pnpm build

      - name: Check publish dependency specifiers (dev follow-up)
        if: ${{ steps.version.outputs.devVersion != '' }}
        run: pnpm check:publish-deps

      - name: Publish packages (dev follow-up)
        if: ${{ steps.version.outputs.devVersion != '' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/publish-packages.mjs --tag dev

      - name: Create lightweight git tag (dev follow-up)
        if: ${{ steps.version.outputs.devVersion != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.devVersion }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; skipping"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -X POST \
              -f ref="refs/tags/v$VERSION" \
              -f "sha=$GITHUB_SHA"
          fi

      # Tell prisma-cli a family package shipped, so its auto-repin
      # workflow can open the repin PR that deploys a dev CLI carrying
      # this publish (prisma-cli docs/oss/versioning.md, operator ruling
      # 2026-08-13). Guarded on the PAT and never fails the publish: the
      # repin has a daily scheduled backstop in prisma-cli, so a missed
      # dispatch delays it by at most a day.
      - name: Notify prisma-cli
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry-run != 'true' }}
        continue-on-error: true
        env:
          DISPATCH_PAT: ${{ secrets.PRISMA_CLI_DISPATCH_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$DISPATCH_PAT" ]; then
            echo "PRISMA_CLI_DISPATCH_PAT is not configured; skipping (the daily backstop covers this)."
            exit 0
          fi
          curl -sSf --connect-timeout 10 --max-time 30 -X POST \
            -H "Authorization: Bearer $DISPATCH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/prisma/prisma-cli/dispatches \
            -d "{\"event_type\":\"family-published\",\"client_payload\":{\"repo\":\"prisma/prisma\",\"version\":\"$VERSION\"}}"
