name: Supabase CLI
description: >
  Install the pinned Supabase CLI and name the Actions cache entry that holds
  the Docker images `supabase start` pulls for examples/supabase. That image
  set is fixed by the CLI version and examples/supabase/supabase/config.toml,
  so the cache key is built from both. The supabase-acceptance job in ci.yml
  restores the entry; the supabase-images.yml workflow writes it.

outputs:
  images-cache-key:
    description: "Cache key for the Supabase Docker images archive."
    value: ${{ steps.install.outputs.images-cache-key }}
  images-archive:
    description: "Path of the `docker save` archive stored under that key."
    value: ${{ steps.install.outputs.images-archive }}

runs:
  using: composite
  steps:
    # Installed from the pinned release binary rather than
    # supabase/setup-cli: the org allowlists actions, and only the
    # repositories CI already uses are on it. Bumping the CLI is a
    # two-line change (version + sha, both from the release's
    # supabase_<version>_checksums.txt).
    - name: Install Supabase CLI (pinned release binary)
      id: install
      shell: bash
      env:
        SUPABASE_CLI_VERSION: 2.95.4
        SUPABASE_CLI_SHA256: 01a3b8f5861d108a934937cae88e8d503093c3f7d3aa32d959f69b099b4f9ef3
      run: |
        set -euo pipefail
        curl -fsSL -o "$RUNNER_TEMP/supabase.tar.gz" \
          "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
        echo "$SUPABASE_CLI_SHA256  $RUNNER_TEMP/supabase.tar.gz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/bin"
        tar -xzf "$RUNNER_TEMP/supabase.tar.gz" -C "$RUNNER_TEMP/bin" supabase
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        config_hash=$(sha256sum "$GITHUB_WORKSPACE/examples/supabase/supabase/config.toml" | cut -c1-16)
        {
          echo "images-cache-key=supabase-images-${RUNNER_OS}-${SUPABASE_CLI_VERSION}-${config_hash}"
          echo "images-archive=$RUNNER_TEMP/supabase-images.tar"
        } >> "$GITHUB_OUTPUT"
