name: Bug report
description: Report something that doesn't work as expected.
labels: ["kind/bug", "bug/1-unconfirmed"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Before filing, please check that:

        - You are on the latest release of the line you use. For Prisma 8, that is the latest release candidate: while we are pre-1.0, only the latest release receives fixes. For Prisma 7, that is the latest `7.x`: Prisma 7 is maintained on the [`v7` branch](https://github.com/prisma/orm/tree/v7) of this repository and receives bug fixes for eighteen months after `8.0.0` final, so Prisma 7 reports belong here too. If you are on an older release, please upgrade and re-verify before filing.
        - You are not reporting a security issue. **Do not file public issues for security reports** — use [Private Vulnerability Reporting](https://github.com/prisma/orm/security/advisories/new) instead.

  - type: input
    id: package-and-version
    attributes:
      label: Package and version
      description: Which `@prisma/*` package (or the `prisma` CLI) and version are you using? Prisma 7 versions are welcome.
      placeholder: "e.g. @internal/postgres@0.5.2, or prisma@7.10.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        The smaller, the better. A failing test, a tiny repo, or a self-contained code snippet is far easier to triage than a description of behaviour in a larger app. If your reproduction depends on a database, please include schema + a small dataset.
      placeholder: |
        ```ts
        // schema.psl + the query that fails + the contract.json (if relevant)
        ```
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Node version, OS, package manager, target database (Postgres / SQLite / Mongo) + version, anything else relevant.
      placeholder: |
        - Node: 24.5.0
        - OS: macOS 15.1 / Ubuntu 24.04 / Windows 11
        - Package manager: pnpm 10.27.0
        - Database: Postgres 17.0
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that would help diagnose — logs, stack traces, related issues, screenshots.
    validations:
      required: false
