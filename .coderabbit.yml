# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  path_filters:
    - "!projects/**"
  auto_review:
    base_branches:
      - ".*"
  path_instructions:
    - path: "**/*.{md,mdc}"
      instructions: >-
        Review the text this pull request adds or changes, not the rest of the file, as a reader who has none
        of the author's context, and check its facts against the code in this repository. Flag: a statement
        about what the code, a command or a check does that the code contradicts; a code sample or command
        that would not work as written; a package, file, function, flag, script or error code that the text
        presents as this repository's and that does not exist; a rule or fact that the change removes or
        alters with nothing in the pull request explaining why; the same rule stated differently in two files,
        including a file the pull request did not change; a relative link or heading anchor that does not
        resolve. In text that explains or teaches (a decision record, a guide, a policy page, a README's
        prose), also flag: a term used before it is explained, where a link to its definition counts as an
        explanation; a mechanism explained before the problem it solves; a rule stated with no example that
        shows it; a long paragraph that packs in several rules and would read better as a list or a table.
        Do not apply those four to reference tables, indexes, checklists or changelogs. In a decision record
        under docs/architecture docs/adrs/, also flag a ticket number, a pull request number, a project
        milestone, and any account of a state the system passed through, such as "before this refactor" or
        "we used to"; history that explains something permanent, such as versions that remain published, is
        fine. Do not comment on wording that is merely different from how you would write it.
    - path: "**/*.{ts,tsx,mts,cts,js,mjs,cjs}"
      instructions: >-
        Decimal, bigint and 64-bit integer types exist to hold values a JavaScript number would round, so flag
        a change that routes such a value through a number for convenience: Number() or parseFloat() on it
        without a check that proves the conversion is exact (a safe-integer range check is enough for a bigint or
        64-bit integer, but not for a Decimal, since 1.0000000000000001 passes a range check and becomes 1), or
        an override of valueOf or Symbol.toPrimitive on a value class meant to make <, >, == or arithmetic
        work. A string-returning override is wrong too, because < then compares "10" and "2" as text. Native
        bigint comparison, addition, subtraction and multiplication are already exact (division drops the fraction). Decimal has no exact operators, since JavaScript has no operator
        overloading, so ask for its own methods instead, such as a.lt(b) or a.cmp(b). Also flag a subclass
        or patch that changes a third-party library's documented behaviour; that belongs upstream.
