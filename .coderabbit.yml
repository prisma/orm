# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  path_filters:
    - "!projects/**"
  auto_review:
    base_branches:
      - ".*"
  path_instructions:
    - path: "**/*.{ts,tsx,mts,cts,js,mjs,cjs}"
      instructions: >-
        Decimal, bigint and 64-bit integer types exist to hold values a JavaScript number would round, so flag
        a change that routes such a value through a number for convenience: Number() or parseFloat() on it
        without a check that proves the conversion is exact (a safe-integer range check is enough for a bigint or
        64-bit integer, but not for a Decimal, since 1.0000000000000001 passes a range check and becomes 1), or
        an override of valueOf or Symbol.toPrimitive on a value class meant to make <, >, == or arithmetic
        work. A string-returning override is wrong too, because < then compares "10" and "2" as text. Native
        bigint comparison, addition, subtraction and multiplication are already exact (division drops the fraction). Decimal has no exact operators, since JavaScript has no operator
        overloading, so ask for its own methods instead, such as a.lt(b) or a.cmp(b). Also flag a subclass
        or patch that changes a third-party library's documented behaviour; that belongs upstream.
    - path: "packages/9-public/@prisma/*/api.txt"
      instructions: >-
        This generated file lists everything users can import from a published package: one line for each export
        of each import path, and one for each of its members. Once a release exports an API, users can depend on it, and from 8.0.0 it must be kept, without
        breaking changes, until the next major release, so review each added and removed line as a promise to users. Follow the review
        criteria in packages/9-public/AGENTS.md: is each addition meant to be supported until the next major,
        at the right maturity (a name starting with ea_, preview_ or rc_, capitalised on a type or class as in
        Ea_Search, may still change); is a new member on an interface that users implement optional; is each removal
        or change either to a name that carries a level, or recorded as a deliberate break with a reason. Lines that changed only
        because a non-exported type was renumbered (such as Options_2) or an outside type gained its package
        prefix are not API changes; say so. Check that the pull request description's "API changes" section
        names each changed export with a reason that matches the change.
    - path: "packages/9-public/@prisma/*/api-breaks.json"
      instructions: >-
        These files record changes that CI would otherwise report as breaking code written against the last
        release. A new record lets one through, so follow the criteria in packages/9-public/AGENTS.md ("A change to a record"): a record of kind break needs a reason a user would accept and a mention
        in the release notes; a record of kind allowed claims the change is permitted (it is safe for users, or it breaks only an API whose name carries a level), so
        check that claim, because calling a real break allowed hides it from users. A record replaced with a new
        fingerprint covers whatever the export's test reports now, not only the break it first covered: check the
        current break the job reports, not only the reason.
    - path: "packages/9-public/removed-packages.json"
      instructions: >-
        This file records published packages that were removed, which CI would otherwise report as breaking
        code written against the last release. Every record is a break: follow the criteria in
        packages/9-public/AGENTS.md ("A change to a record"). It needs a reason a user would
        accept and a mention in the release notes.
    - path: "examples/last-release-errors.json"
      instructions: >-
        This file records errors that the last release's example apps get against the current build, which CI
        would otherwise report. A new record lets one through, so follow the criteria in
        packages/9-public/AGENTS.md ("A change to a record"): a record of kind break needs a
        reason a user would accept and a mention in the release notes; a record of kind allowed claims the change is permitted (it is safe for users, or it breaks only an API whose name carries a level), so check that claim, because calling a real break allowed hides
        it from users. A record replaced with a new message covers the error the job reports now: compare the
        new message with the old one, and check that the reason still fits it.
