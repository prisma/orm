# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
early_access: false
reviews:
  # The profile the organisation UI applies to this branch. It is set
  # explicitly because the presence of a repository config would otherwise
  # take the schema default of "chill" and quietly relax reviews here.
  profile: 'assertive'
  path_filters:
    - '!projects/**'
  auto_review:
    # CodeRabbit reviews only the default branch unless a base branch is named
    # here. The default branch carries the same entry: which copy governs the
    # gate for a pull request based on v7 is not settled by the documentation,
    # and a setting that silently does nothing is the failure mode worth
    # avoiding.
    base_branches:
      - 'v7'
  path_instructions:
    - path: '**/*.{ts,tsx,mts,cts,js,mjs,cjs}'
      instructions: >-
        Decimal, bigint and 64-bit integer types exist to hold values a JavaScript number would round, so flag
        a change that routes such a value through a number for convenience: Number() or parseFloat() on it
        without a check that proves the value fits exactly (a range check before the conversion is fine), or
        an override of valueOf or Symbol.toPrimitive on a value class (Prisma.Decimal included) meant to make
        <, >, == or arithmetic work. A string-returning override is wrong too, because < then compares "10"
        and "2" as text. Native bigint operators are already exact. Decimal has no exact operators, since
        JavaScript has no operator overloading, so ask for its own methods instead, such as a.lt(b) or
        a.cmp(b). Also flag a subclass or patch that changes a third-party library's documented behaviour;
        that belongs upstream.
